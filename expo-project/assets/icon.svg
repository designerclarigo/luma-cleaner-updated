<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244D3F"/>
      <stop offset="100%" stop-color="#142C24"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#DCE8B0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#DCE8B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F7F3"/>
      <stop offset="100%" stop-color="#E2EFE7"/>
    </linearGradient>
  </defs>

  <!-- Background with smooth rounded squircle corners -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>

  <!-- Subtle ambient halo behind camera lens -->
  <circle cx="610" cy="410" r="320" fill="url(#haloGrad)"/>

  <!-- Centered Luma Camera Aperture Frame (scaled from 48x48 to 576x576) -->
  <g transform="translate(224, 224) scale(12)">
    <!-- Ambient glow -->
    <circle cx="28" cy="18" r="14" fill="#DCE8B0" fill-opacity="0.25" />

    <!-- Main camera frame with top-right light opening -->
    <path
      d="M 28 6 H 14 C 9.58 6 6 9.58 6 14 V 34 C 6 38.42 9.58 42 14 42 H 34 C 38.42 42 42 38.42 42 34 V 20"
      stroke="#F8F7F3"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Light aperture ray -->
    <path
      d="M 28 6 L 42 20"
      stroke="#DCE8B0"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="1 5"
      fill="none"
    />

    <!-- Inner memory lens circle -->
    <circle
      cx="22"
      cy="26"
      r="6"
      stroke="#F8F7F3"
      stroke-width="2.5"
      fill="none"
    />
    <circle
      cx="24"
      cy="24"
      r="2.5"
      fill="#DCE8B0"
    />
  </g>
</svg>
